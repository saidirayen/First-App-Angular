<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow" style="max-width: 750px; width: 100%;">
    <div class="card-body">
      <h3 class="text-center fw-bold mt-3">{{isEdit ? 'Modifier le Formateur' : 'Ajouter un Formateur'}}</h3>

      <form (ngSubmit)="sauvegarder()" #f="ngForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Nom</label>
          <input type="text" class="form-control" [(ngModel)]="formateur.nom" name="nom" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Prénom</label>
          <input type="text" class="form-control" [(ngModel)]="formateur.prenom" name="prenom" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="formateur.email" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Téléphone</label>
          <input type="text" class="form-control" [(ngModel)]="formateur.telephone" name="telephone" required>
        </div>
        <div class="mb-3">
          <label class="form-label">CIN</label>
          <input type="text" class="form-control" [(ngModel)]="formateur.cin" name="cin" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Spécialités</label>
          <input type="text" class="form-control" [(ngModel)]="formateur.specialites" name="specialites" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Photo</label>
          <input type="file" class="form-control" [(ngModel)]="formateur.photo" name="photo">
        </div>
        <div class="mb-3">
          <label class="form-label">CV</label>
          <input type="file" class="form-control" [(ngModel)]="formateur.cv" name="cv">
        </div>
        <button class="btn btn-primary w-100 mb-2" [disabled]="f.invalid">Sauvegarder</button>
        <a routerLink="/admin/formateurs" class="btn btn-outline-secondary w-100">Annuler</a>
      </form>
    </div>
  </div>
</div>
