<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow" style="max-width: 700px; width: 100%;">
    <div class="card-body">
      <h3 class="text-center fw-bold mt-3">{{isEdit ? 'Modifier le Candidat' : 'Ajouter un Candidat'}}</h3>
      <form (ngSubmit)="sauvegarder()" #f="ngForm" novalidate>
        <div class="mb-3">
            <label class="form-label">Nom</label>
            <input type="text" name="nom" class="form-control" [(ngModel)]="candidat.nom" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Prénom</label>
          <input type="text" name="prenom" class="form-control" [(ngModel)]="candidat.prenom" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" [(ngModel)]="candidat.email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">CIN</label>
          <input type="text" name="cin" class="form-control" [(ngModel)]="candidat.cin" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input type="text" name="password" class="form-control" [(ngModel)]="candidat.password" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Photo</label>
          <input type="file" name="photo" class="form-control" [(ngModel)]="candidat.photo">
        </div>
        <button class="btn btn-primary w-100 mb-2" [disabled]="f.invalid">Sauvegarder</button>
        <a [routerLink]="['/admin/candidats']" class="btn btn-outline-secondary w-100">Annuler</a>
      </form>
    </div>
  </div>
</div>
