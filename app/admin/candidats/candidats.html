<div class="container py-4">
  <div class="mb-4 d-flex justify-content-between align-items-center">
    <h3 class="fw-bold mb-3">Gestion des Candidats</h3>
    <a routerLink="/admin/candidats/add" class="btn btn-primary">Ajouter un candidat</a>
  </div>
  <div class="table-responsive">
    <table class="table table-hover align-middle text-center">
      <thead class="table-light">
        <tr>
          <th>Photo</th>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Email</th>
          <th>CIN</th>
          <th>Mot de passe</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (c of candidats; track c.id){
          <tr>
            <td>
              @if(c.photo!==""){
                <img [src]="'assets/candidats/'+c.photo" class="rounded-circle shadow-sm" width="100" height="100" alt="photo candidat">
              }
              @else{
                <img [src]="'assets/candidats/default.jpg'" class="rounded-circle shadow-sm" width="100" height="100" alt="photo candidat">
              }
              </td>
            <td>{{c.nom}}</td>
            <td>{{c.prenom}}</td>
            <td>{{c.email}}</td>
            <td>{{c.cin}}</td>
            <td>{{c.password}}</td>
            <td>
              <div class="d-flex justify-content-center gap-2 flex-nowrap">
                <a class="btn btn-sm btn-outline-warning me-2" [routerLink]="['/admin/candidats/edit',c.id]">Modifier</a>
                <button class="btn btn-sm btn-outline-danger"(click)="delete(c.id)">Supprimer</button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

</div>
