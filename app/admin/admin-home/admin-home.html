<div class="container py-5">
  <div class="text-center mb-4">
    <h2 class="display-5 fw-bold text-primary mb-3">Tableau de Bord Administrateur</h2>
    <p class="text-muted">Gérer les différentes sections de la plateforme</p>
  </div>
  <div class="row g-4">
    <div class="col-12 col-md-6">
      <a routerLink="/admin/candidats" class="text-decoration-none">
        <div class="card admin-card text-center shadow-sm h-100">
          <div class="card-body py-5">
            <i class="bi bi-people-fill fs-1 text-warning mb-3"></i>
            <h4 class="text-dark mt-2">{{nbCandidats}}</h4>
            <p class="text-muted mb-0">Gérer les Candidats</p>
          </div>
        </div>
      </a>
    </div>
    <div class="col-12 col-md-6">
      <a routerLink="/admin/formateurs" class="text-decoration-none">
        <div class="card admin-card text-center shadow-sm h-100">
          <div class="card-body py-5">
            <i class="bi bi-person-badge fs-1 text-info mb-3"></i>
            <h4 class="text-dark mt-2">{{nbFormateurs}}</h4>
            <p class="text-muted mb-0">Gérer les Formateurs</p>
          </div>
        </div>
      </a>
    </div>
    <div class="col-12 col-md-6">
      <a routerLink="/admin/formations" class="text-decoration-none">
        <div class="card admin-card text-center shadow-sm h-100">
          <div class="card-body py-5">
            <i class="bi bi-journal-code fs-1 text-primary mb-3"></i>
            <h4 class="text-dark mt-2">{{nbFormations}}</h4>
            <p class="text-muted mb-0">Gérer les Formations</p>
          </div>
        </div>
      </a>
    </div>
    <div class="col-12 col-md-6">
      <a routerLink="/admin/sessions" class="text-decoration-none">
        <div class="card admin-card text-center shadow-sm h-100">
          <div class="card-body py-5">
            <i class="bi bi-calendar-event fs-1 text-success mb-3"></i>
            <h4 class="text-dark mt-2">{{nbSessions}}</h4>
            <p class="text-muted mb-0">Gérer les Sessions</p>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
