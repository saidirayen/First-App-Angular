<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow" style="max-width: 900px; width: 100%;">
    <div class="card-body">
      <h3 class="text-center fw-bold">{{ isEdit ? 'Modifier la Session' : 'Ajouter une Session' }}</h3>
      <form (ngSubmit)="sauvegarder()" #f="ngForm">
        <div class="mb-3 mt-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" name="description" [(ngModel)]="session.description"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Formation</label>
          <select class="form-select" name="formation" [(ngModel)]="session.formation" required>
            @for(formation of formations; track formation.id){
              <option [ngValue]="formation">{{formation.titre}}</option>
            }
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Formateurs</label>
          <select class="form-select" name="formateurs" [(ngModel)]="session.formateurs" multiple required>
            @for(formateur of formateurs; track formateur.id){
              <option [ngValue]="formateur">{{formateur.nom}} {{formateur.prenom}}</option>
            }
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Candidats</label>
          <select class="form-select" name="candidats" [(ngModel)]="session.candidats" multiple>
            @for(candidat of candidats; track candidat.id){
              <option [ngValue]="candidat">{{candidat.nom}} {{candidat.prenom}}</option>
            }
          </select>
        </div>
        <div class="row">
          <div class="col">
            <label class="form-label">Date début</label>
            <input type="date" class="form-control" name="dateDebut" [(ngModel)]="session.dateDebut" required>
          </div>
          <div class="col">
            <label class="form-label">Date fin</label>
            <input type="date" class="form-control" name="dateFin" [(ngModel)]="session.dateFin" required>
          </div>
        </div>
        <button class="btn btn-primary w-100 mt-3" [disabled]="f.invalid">Sauvegarder</button>
        <a routerLink="/admin/sessions" class="btn btn-outline-secondary w-100 mt-2">Annuler</a>
      </form>
    </div>
  </div>
</div>
