<div class="container mt-5">
    <h2 class="mb-3 text-center fw-bold">Rechercher une formation</h2>
    
    <div class="search-wrapper mb-5 mx-auto">
    <div class="input-group input-group-lg shadow-sm">
      <span class="input-group-text bg-white">
        <i class="bi bi-search text-muted"></i>
      </span>
      <input type="text" class="form-control" placeholder="Java, web, sécurité.." [(ngModel)]="tag" (input)="chercher()">
    </div>
    </div>
    @for(f of formations; track f){
    <div class="card mb-4 shadow-sm formation-card">
        <div class="card-body">
            <h5>{{f.titre}}</h5>
            <p>{{f.description}}</p>
            <p>
            @for(t of f.tags; track t) {
                <span class="badge bg-secondary me-1">{{t}}</span>
            }
            </p>
            <a [routerLink]="['/public/formation-details',f.id]" class="btn btn-primary">Détails</a>
        </div>
    </div> 
  }
</div>
